version: '3.9'

services:
  tunelab:
    build: .
    image: tunelab:latest
    container_name: tunelab-studio
    ports:
      - "7860:7860"
      - "9000:9000"
    environment:
      # ⚠️ REPLACE WITH YOUR ACTUAL GROQ API KEY
      - GROQ_API_KEY=your_groq_api_key_here
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
